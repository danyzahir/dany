<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 270" width="100%" height="100%">
  <defs>
    <!-- Background Dot Pattern -->
    <pattern id="dot-grid" x="0" y="0" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="2" fill="#000000" opacity="0.18" />
    </pattern>
    <style>
      .font-black { font-family: 'Space Grotesk', 'Impact', 'Arial Black', sans-serif; font-weight: 900; }
      .font-mono { font-family: 'JetBrains Mono', 'Courier New', monospace; font-weight: 800; }
      .font-sans { font-family: 'Inter', 'Helvetica Neue', sans-serif; font-weight: 800; }
    </style>
  </defs>

  <!-- Background Base Container -->
  <rect x="12" y="12" width="826" height="246" fill="#000000" />
  <rect x="6" y="6" width="826" height="246" fill="#FFE600" stroke="#000000" stroke-width="4" />
  <rect x="6" y="6" width="826" height="246" fill="url(#dot-grid)" />

  <!-- TOP RIGHT STICKER BADGE -->
  <g transform="translate(630, 22) rotate(3)">
    <rect x="4" y="4" width="185" height="38" fill="#000000" />
    <rect x="0" y="0" width="185" height="38" fill="#00E5FF" stroke="#000000" stroke-width="3" />
    <!-- Vector Star -->
    <path d="M 22 19 L 24 13 L 30 13 L 25 17 L 27 23 L 22 19 L 17 23 L 19 17 L 14 13 L 20 13 Z" fill="#000000" />
    <text x="110" y="24" class="font-mono" font-size="13" fill="#000000" text-anchor="middle">PRO DEVELOPER</text>
  </g>

  <!-- MAIN HERO CARD -->
  <g transform="translate(30, 28)">
    <!-- Card Shadow -->
    <rect x="8" y="8" width="570" height="124" fill="#000000" />
    <!-- Card Body -->
    <rect x="0" y="0" width="570" height="124" fill="#FF52D9" stroke="#000000" stroke-width="4" />
    
    <!-- Top Terminal Bar -->
    <rect x="0" y="0" width="570" height="28" fill="#000000" />
    <circle cx="16" cy="14" r="5" fill="#FF0055" />
    <circle cx="32" cy="14" r="5" fill="#FFE600" />
    <circle cx="48" cy="14" r="5" fill="#00E5FF" />
    <text x="68" y="19" class="font-mono" font-size="11" fill="#FFFFFF">DEVELOPER_PROFILE.EXE /// NEO_BRUTALISM</text>

    <!-- Main Title (No hand emoji, pure bold typography) -->
    <text x="22" y="72" class="font-black" font-size="34" fill="#000000" letter-spacing="1">HALO! SAYA DEVELOPER</text>
    <text x="22" y="102" class="font-sans" font-size="15" fill="#000000" letter-spacing="0.5">FULL-STACK DEVELOPER &amp; UI/UX CREATIVE CODER</text>
  </g>

  <!-- STATUS CHIPS ROW (WITH PURE VECTOR SVG ICONS, NO EMOJIS) -->
  
  <!-- Chip 1: LOCATION -->
  <g transform="translate(30, 168)">
    <rect x="3" y="3" width="175" height="38" fill="#000000" />
    <rect x="0" y="0" width="175" height="38" fill="#7000FF" stroke="#000000" stroke-width="3" />
    <!-- Premium Vector Map Pin Icon -->
    <path d="M 22 12 C 18.5 12 15.5 15 15.5 18.5 C 15.5 23.5 22 28 22 28 C 22 28 28.5 23.5 28.5 18.5 C 28.5 15 25.5 12 22 12 Z M 22 20.5 C 20.9 20.5 20 19.6 20 18.5 C 20 17.4 20.9 16.5 22 16.5 C 23.1 16.5 24 17.4 24 18.5 C 24 19.6 23.1 20.5 22 20.5 Z" fill="#FFFFFF" />
    <text x="104" y="24" class="font-mono" font-size="13" fill="#FFFFFF" text-anchor="middle">INDONESIA</text>
  </g>

  <!-- Chip 2: STATUS -->
  <g transform="translate(220, 168)">
    <rect x="3" y="3" width="210" height="38" fill="#000000" />
    <rect x="0" y="0" width="210" height="38" fill="#00FF66" stroke="#000000" stroke-width="3" />
    <!-- Premium Vector Lightning Bolt Icon -->
    <path d="M 22 11 L 14 21 L 20 21 L 18 29 L 27 18 L 21 18 Z" fill="#000000" stroke="#000000" stroke-width="1.5" stroke-linejoin="round" />
    <text x="120" y="24" class="font-mono" font-size="13" fill="#000000" text-anchor="middle">OPEN FOR HIRE</text>
  </g>

  <!-- Chip 3: STACK -->
  <g transform="translate(445, 168)">
    <rect x="3" y="3" width="190" height="38" fill="#000000" />
    <rect x="0" y="0" width="190" height="38" fill="#FF6B00" stroke="#000000" stroke-width="3" />
    <!-- Premium Vector Code Bracket Icon -->
    <path d="M 18 15 L 13 19 L 18 23 M 26 15 L 31 19 L 26 23 M 23 13 L 20 25" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" fill="none" />
    <text x="114" y="24" class="font-mono" font-size="13" fill="#FFFFFF" text-anchor="middle">LARAVEL &amp; REACT</text>
  </g>

  <!-- DECORATIVE BRUTALIST 3D BADGE (RIGHT SIDE) -->
  <g transform="translate(670, 95) rotate(-8)">
    <rect x="5" y="5" width="135" height="115" fill="#000000" />
    <rect x="0" y="0" width="135" height="115" fill="#00E5FF" stroke="#000000" stroke-width="4" />
    <path d="M 67.5 12 L 67.5 103 M 12 57.5 L 123 57.5" stroke="#000000" stroke-width="5" />
    <circle cx="67.5" cy="57.5" r="22" fill="#FFE600" stroke="#000000" stroke-width="3" />
    <text x="67.5" y="63" class="font-black" font-size="18" fill="#000000" text-anchor="middle">100%</text>
  </g>

  <!-- BOTTOM TICKER BAR -->
  <rect x="6" y="222" width="826" height="30" fill="#000000" />
  <text x="20" y="242" class="font-mono" font-size="12" fill="#FFE600">
    /// HIGH CONTRAST /// BOLD TYPOGRAPHY /// CLEAN CODE /// FAST PERFORMANCE /// NO BORING DESIGN ///
  </text>
</svg>
